# /etc/nginx/sites-available/shiftlatam.agency
# Proxy reverse para Next.js standalone corriendo en PM2 :3001
#
# Notas:
#   - proxy_buffering off en /api/agent es CRÍTICO para que el SSE
#     de Shifty llegue chunk-by-chunk en vez de un solo golpe.
#   - X-Accel-Buffering ya lo seteamos server-side en next.config.ts,
#     pero lo reforzamos acá por si el upstream se lo come.
#   - client_max_body_size 2M alcanza para forms; Shifty no manda files.

server {
    listen 80;
    listen [::]:80;
    server_name shiftlatam.agency www.shiftlatam.agency;

    # Certbot challenge — lo dejamos antes del redirect para que
    # el primer issue funcione sobre HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Hasta que certbot corra, servimos HTTP directo. Después de
    # `certbot --nginx` esto se reemplaza por un 301 → HTTPS.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / SSE — Shifty stream necesita esto.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts generosos para streams largos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Override exclusivo para SSE del agente: sin buffering, sin
    # compresión, conexión viva.
    location /api/agent {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    client_max_body_size 2M;

    # Logs separados por vhost para debug rápido.
    access_log /var/log/nginx/shiftlatam.agency.access.log;
    error_log  /var/log/nginx/shiftlatam.agency.error.log;
}
