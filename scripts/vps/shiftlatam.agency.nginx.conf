# /etc/nginx/sites-available/shiftlatam.agency
# Proxy reverse para Next.js standalone corriendo en PM2 :3002
#
# IMPORTANTE: este archivo INCLUYE el bloque HTTPS — no solo HTTP. Si
# solamente dejás el bloque port 80, certbot al re-aplicar va a re-
# agregar el 443 pero un re-scp del template lo borraría. La forma
# segura es mantener AMBOS bloques explícitos acá.
#
# Notas:
#   - proxy_buffering off en /api/agent es CRÍTICO para que el SSE
#     de Shifty llegue chunk-by-chunk en vez de un solo golpe.
#   - X-Accel-Buffering ya lo seteamos server-side en next.config.ts,
#     pero lo reforzamos acá por si el upstream se lo come.
#   - client_max_body_size 2M alcanza para forms; Shifty no manda files.
#   - Port 3002 (no 3001) porque shift-ai-gateway en el mismo VPS spawnea
#     un Vite child en :3001 que entra en conflicto.

# ─────────────────────────────────────────────────────────────────────
# HTTPS vhost — el principal
# ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shiftlatam.agency www.shiftlatam.agency;

    ssl_certificate     /etc/letsencrypt/live/shiftlatam.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiftlatam.agency/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2M;

    # Logs separados por vhost para debug rápido.
    access_log /var/log/nginx/shiftlatam.agency.access.log;
    error_log  /var/log/nginx/shiftlatam.agency.error.log;

    # Override exclusivo para SSE del agente: sin buffering, sin
    # compresión, conexión viva. Va ANTES del location / catch-all.
    location /api/agent {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / SSE — Shifty stream necesita esto.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts generosos para streams largos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ─────────────────────────────────────────────────────────────────────
# HTTP vhost — redirect a HTTPS + acme-challenge para renovaciones
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name shiftlatam.agency www.shiftlatam.agency;

    # Certbot challenge para renovaciones automáticas.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}
