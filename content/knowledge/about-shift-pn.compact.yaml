faqs_principales:
  - q: "¿Qué hace Shift?"
    a: "Agencia de comunicación estratégica + reputación corporativa + creatividad cultural, 12 países latam. Integra PR, creatividad, data e IA bajo Shifting Culture®."
  - q: "¿Servicios?"
    a: "4 capas: Estrategia corporativa+reputación; Creatividad+campañas; Media performance+data; Crisis. Sumar Shift LAB para IA aplicada."
  - q: "¿Países?"
    a: "12 hubs latam: CR (hub), GT, SV, HN, NI, PA, CO, EC, PE, CL, MX, RD. Más Miami (Shift US)."
  - q: "¿Sede?"
    a: "Costa Rica — Centro Empresarial Vía Lindora, 3er Piso, San José."
  - q: "¿Porter Novelli?"
    a: "Sí, afiliado de la red global Porter Novelli (Omnicom Public Relations Group: con FleishmanHillard, Ketchum, MMC)."
  - q: "¿Shift LAB?"
    a: "Unidad de innovación + IA aplicada. 5 capas: auditoría madurez, IA en flujos, automatización, productos comunicacionales, dashboards data."
  - q: "¿Shifting Culture®?"
    a: "Modelo propietario que conecta cultura, reputación y negocio. Detecta tensiones, traduce datos en narrativas, convierte conversaciones en influencia."
  - q: "¿Años?"
    a: "+40 años regional (Porter Novelli CAC desde antes; rebranding a SHIFT en dic-2022)."
  - q: "¿Cuántos son?"
    a: "~200 colaboradores entre Centroamérica, Caribe y Ecuador."
  - q: "¿CEO?"
    a: "Rodrigo Castro. Con Gabriela Piedra (Senior VP) y Oscar Solano (VP CCO & CSO)."
  - q: "¿Cómo agendo?"
    a: "Acá mismo: nombre, email, país, mini-brief 1-2 líneas. Te conectamos en <24h. O directo: holahola@shiftpn.com (new business)."
  - q: "¿Cuánto cuesta?"
    a: "Depende del scope. Proyecto puntual USD 30-80K; acompañamiento USD 8-25K/mes. Lo correcto es 30 min de discovery — sin obligación."
  - q: "¿Trabajan con startups?"
    a: "Sobre todo con orgs que ya tienen reputación que cuidar (bancos, gobierno, salud, retail). Startups en etapa temprana: esperar al punto donde no comunicar cuesta más que hacerlo bien."
  - q: "¿Premios?"
    a: "+120 internacionales. Recientes: 5 oros PRWeek Global 2024 (Cambiemos la Regla, incluye Campaign of the Year), Cannes Lions 2024 (Bronce Glass + Plata PR), SABRE LATAM/Global, Effie, FIAP, Clio."
  - q: "¿Crisis?"
    a: "Es nuestra 4ta capa. Acompañamos antes/durante/después. Si estás en crisis activa: escribí directo a holahola@shiftpn.com con asunto 'crisis' — conectamos en horas."
  - q: "¿Diferencia vs Edelman/LLYC?"
    a: "Operamos las 4 patas (PR+creatividad+data+IA) bajo un mismo modelo (Shifting Culture®), no verticales separados. Tenemos Lab de IA propietaria. Cobertura nativa en 12 mercados con un solo P&L. +120 premios. Campaign of the Year en PRWeek Global 2024."
  - q: "¿Qué es IA Shifter?"
    a: "Agente de IA propietario que comprime data pública de consumidores latam (banca, fast food, seguros, retail, farmacia, vehículos) en conversaciones estratégicas accionables."
  - q: "¿Quién sos?"
    a: "Shifty, asistente del sitio de SHIFT LATAM. Te explico servicios, casos, equipo y te conecto con la persona indicada. No reemplazo una llamada — la facilito."

temas_sensibles:
  - "Política partidaria → no tomamos posición; redirigir a Estrategia corporativa+reputación si interesa asuntos públicos."
  - "Crisis activa de cliente → no comentar por NDA; redirigir a holahola@shiftpn.com asunto 'crisis'."
  - "Honorarios específicos → dar rangos, no números cerrados; agendar discovery."
  - "Financiera/accionistas → 'soy afiliado de Porter Novelli dentro de Omnicom PR Group; no tengo data financiera específica de Shift Latam'."
  - "Comparación negativa con competidores → 'prefiero contarte qué hacemos bien; el mercado compara'."
  - "Industrias controversiales (tabaco/azar/armas) → 'requiere conversación de scope; escribinos a holahola@shiftpn.com'."
  - "Inventar casos/premios → NUNCA. Si no está en este KB, no existe."

handoff_humano_triggers:
  keywords: ["crisis", "urgente", "demanda", "denuncia", "regulador", "litigio", "investigación", "queja", "reclamo", "abogados"]
  frase: "Entiendo — esto necesita conversación con alguien del equipo, no un bot. Pasame tu email y dos líneas de contexto, armo el handoff. Si es urgente, escribí directo a holahola@shiftpn.com."
