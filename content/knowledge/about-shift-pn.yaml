servicios:
  - id: crisis
    nombre: "Crisis y gestión de riesgo"
    descripcion: |
      Acompañamos a organizaciones antes, durante y después de eventos sensibles
      que pueden afectar reputación: incidentes operativos, exposición regulatoria,
      controversias públicas, conflictos laborales o crisis digitales. Combinamos
      monitoreo, vocería, manejo de stakeholders y narrativa estratégica.
    cuando_aplica:
      - Riesgos regulatorios o ambientales
      - Disputas con autoridades o sindicatos
      - Crisis digitales o virales
      - Cambios de liderazgo bajo escrutinio
      - Recall de producto o fallas operativas
    casos_relevantes:
      - "Cambiemos la Regla (Nosotras Women Connecting + Garnier Group) — impacto regulatorio: ley aprobada en CR para garantizar productos de higiene menstrual"  # prweek + larepublica.net 2024
  - id: media-data
    nombre: "Media performance y data"
    descripcion: |
      Distribución pagada, ganada y propia con medición continua. Integramos
      data de consumo digital, escucha social y performance editorial para
      decidir qué historia mover, en qué canal y a qué audiencia. Incluye
      paid media, SEO/AEO, content marketing y dashboards ejecutivos.
    capabilities:
      - Performance digital (paid + earned)
      - Escucha social y reputación en tiempo real
      - Dashboards ejecutivos de reputación e influencia
      - Mediciones de impacto en behavior y conversión
    casos_relevantes:
      - "Brand Influence Index — herramienta propietaria (en alianza con El Financiero CR) para medir influencia real de marcas con datos de comportamiento, no encuestas"  # elfinancierocr.com 2026
      - "IA Shifter — agente de IA que analiza data pública digital de consumidores en categorías como banca, fast food, seguros y retail"  # delfino.cr 2025-06-19
  - id: creatividad
    nombre: "Creatividad y campañas integradas"
    descripcion: |
      Creatividad aplicada a problemas de negocio y cambio social. Diseñamos
      plataformas integradas que combinan PR, contenido, activación, asuntos
      públicos e influencia cultural. La creatividad no decora: traduce
      tensiones culturales en ideas que mueven mercados.
    capabilities:
      - Campañas integradas regionales y locales
      - PR creativo y storytelling de marca
      - Activaciones culturales y experiencias
      - Influencer y partnerships culturales
      - Producción audiovisual y de contenido
    casos_relevantes:
      - "Bienvenidos al Grupo / Welcome to the Group — Cannes Lions 2024: Bronce Glass Lion + Plata PR Lion (con PHD y RIOT/TBWA Costa Rica)"  # larepublica.net
      - "Colors of Costa Rica — Instituto Costarricense de Turismo (ICT) + Mario Hernández + artista Franko 'Pizuikas' Guevara, lanzado octubre 2025"  # latinspots.com
      - "Tucán ¡Está Volando! — Banco de Costa Rica (BCR), 2025: relanzamiento del ecosistema de corresponsalía no bancaria"  # latinspots.com 2025
      - "BIT Centenario: La Costa Rica del Futuro — Microsoft / Minecraft Education, 2022: SABRE Awards LATAM"  # telediario.cr; sanjosevolando 2023
  - id: estrategia
    nombre: "Estrategia corporativa y reputación"
    descripcion: |
      Consultoría de comunicación a nivel C-suite: arquitectura de reputación
      corporativa, asuntos públicos, comunicación interna, posicionamiento
      ejecutivo y narrativa institucional. Trabajamos con boards, CEOs y
      equipos de relaciones gubernamentales para alinear lo que la compañía
      hace con lo que el mercado escucha.
    capabilities:
      - Reputación corporativa y narrativa de marca
      - Asuntos públicos y relaciones gubernamentales
      - Comunicación interna y de cultura organizacional
      - Posicionamiento ejecutivo (CEO branding)
      - ESG, sostenibilidad y propósito
      - Comunicación financiera y de relación con inversores
    casos_relevantes:
      - "Brand Influence Index — alianza con El Financiero CR para medir influencia corporativa con behavioral data"  # elfinancierocr.com
      - "Acompañamiento estratégico a Banco de Costa Rica (BCR), entidad pública con marca de retail bancario"  # latinspots.com

shiftlab:
  que_es: "Shift LAB es la unidad de innovación e inteligencia artificial aplicada a comunicación de SHIFT LATAM. Integra tecnología, creatividad y negocio para mejorar análisis, acelerar decisiones y potenciar el criterio humano."  # landing /shift-lab
  filosofia: |
    No usamos IA como tendencia. La integramos como flujo operativo donde
    humano y máquina trabajan en el mismo proceso. La tecnología sirve a la
    estrategia, no al revés. No vendemos herramientas: diseñamos sistemas de
    criterio donde la tecnología amplifica —no reemplaza— al equipo humano.
  diferenciador: "Primera agencia de la región en operar con un agente de IA propietario (IA Shifter) que conecta data pública de consumidores con consultoría estratégica accionable en segundos"  # delfino.cr 2025
  capabilities:
    - id: "01"
      titulo: "Auditorías de madurez digital"
      descripcion: "Mapeo del estado real de data, herramientas, criterio y cultura de la organización para construir un plan de IA con horizontes claros."
    - id: "02"
      titulo: "Implementación de IA en flujos estratégicos"
      descripcion: "Integración de modelos al ciclo de planeación, monitoreo de reputación y producción creativa. Sin reemplazar, amplificando."
    - id: "03"
      titulo: "Automatización de procesos"
      descripcion: "Orquestación de tareas repetitivas para liberar tiempo del equipo y enfocarlo en lo que sólo el criterio humano resuelve bien."
    - id: "04"
      titulo: "Diseño de productos comunicacionales"
      descripcion: "Herramientas internas, dashboards y micro-aplicaciones que viven dentro de las campañas y relaciones con audiencias."
    - id: "05"
      titulo: "Dashboards ejecutivos y data intelligence"
      descripcion: "Indicadores accionables de reputación, conversación social, performance editorial y eficiencia operativa, en un solo lugar."
  productos_propietarios:
    - nombre: "IA Shifter"
      lanzamiento: "Junio 2025"
      descripcion: "Agente de IA que comprime data pública digital de consumidores (banca, vehículos, fast food, seguros, retail, farmacia) en conversaciones estratégicas accesibles en segundos."  # delfino.cr
    - nombre: "Brand Influence Index"
      lanzamiento: "Segundo semestre 2026"  # elfinancierocr.com
      descripcion: "Índice de influencia de marca para Costa Rica desarrollado con El Financiero. Mide señales reales de comportamiento (no encuestas de percepción): consumo de contenido, conversación pública y signos de confianza."

shifting_culture:
  registro: "Shifting Culture® (modelo propietario registrado)"  # landing /shifting-culture
  descripcion: |
    Es el modelo propietario de SHIFT LATAM que conecta cultura, reputación
    y negocio en un solo sistema estratégico. Creemos que las marcas no
    compiten por atención sino por significado, y ese significado se
    construye desde la cultura.
  como_funciona: |
    Identifica tensiones culturales relevantes, traduce datos en narrativas
    estratégicas y convierte conversaciones en influencia sostenible. No
    diseñamos campañas aisladas: diseñamos movimientos que impactan
    mercados y comunidades.
  proceso:
    - paso: "01"
      titulo: "Detectamos tensiones culturales"
    - paso: "02"
      titulo: "Transformamos insights en ideas estratégicas"
    - paso: "03"
      titulo: "Activamos creatividad con medición"
    - paso: "04"
      titulo: "Generamos impacto real"
  por_que_es_diferente: |
    Shifting Culture® no es un marco conceptual. Es una metodología
    aplicada que integra estrategia, creatividad, asuntos públicos y data
    bajo un mismo sistema operativo regional.

proposito:
  declaracion: |
    Nuestro propósito es mover cultura para generar impacto real en
    negocios y comunidades. Creemos que la comunicación estratégica no
    sólo debe influir, sino transformar. Conectamos empresas, líderes y
    organizaciones con las conversaciones que definen el futuro de
    Latinoamérica.
  triple_impacto:
    - dimension: "En las personas"
      descripcion: "Cultivando confianza, orgullo y sentido de pertenencia."
    - dimension: "En los negocios"
      descripcion: "Fortaleciendo reputaciones que crean valor a largo plazo."
    - dimension: "En el país"
      descripcion: "Impulsando una comunicación que eleve la conversación pública y fomente el bien común."

