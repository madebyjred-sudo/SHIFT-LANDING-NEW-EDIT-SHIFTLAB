      donde_compite_con_shift: "Reputación corporativa regional, crisis"
    - nombre: "Edelman LATAM"
      foco: "Trust Barometer, reputación corporativa, fuerte en Brasil y México"
      donde_compite_con_shift: "Reputación corporativa, healthcare"
    - nombre: "Burson (ex-Burson Cohn & Wolfe)"
      foco: "PR corporativo global, fuerte en mercados grandes (MX, BR)"
      donde_compite_con_shift: "Cuentas regionales B2B y FMCG"
    - nombre: "Weber Shandwick"
      foco: "Reputación + cultura organizacional, parte de IPG"
      donde_compite_con_shift: "Reputación corporativa, internal comms"
    - nombre: "FleishmanHillard"
      foco: "PR corporativo global, también dentro de OPRG (sister agency dentro de Omnicom)"
      donde_compite_con_shift: "Casi nunca compite — es hermana corporativa dentro de Omnicom"
    - nombre: "Ágora (Brasil)"
      foco: "PR brasileño, agencia del año 2025 PRovoke Media LATAM"
      donde_compite_con_shift: "Mercado brasileño (Shift no opera en Brasil)"
  como_diferenciamos: |
    1. PR + creatividad + data + IA bajo un mismo modelo operativo (Shifting
       Culture®), no como verticales separados.
    2. Cobertura nativa en 10 mercados latinoamericanos con un solo P&L
       regional — gobernanza única, ejecución local.
    3. ShiftLab: primera unidad de IA propietaria en agencia de comms LATAM
       (IA Shifter, Brand Influence Index).
    4. Premiación reciente que coloca a la agencia en el top regional:
       Campaign of the Year en PRWeek Global Awards 2024, Cannes Lions
       2024, SABRE LATAM 2022-2025, +120 premios acumulados.
    5. Fuerte en industrias reguladas y de alto riesgo (banca, gobierno,
       salud) donde la cultura y el contexto local pesan más que la
       metodología global.
  donde_no_competimos: |
    No competimos con boutiques creativas puras de un solo mercado ni con
    redes globales que sólo tienen oficina abogada en el país. Tampoco
    somos una agencia digital-first ni una consultora McKinsey-style.

