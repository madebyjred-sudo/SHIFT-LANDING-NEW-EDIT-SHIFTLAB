# content/knowledge/shift-latam-config.yaml
# Config curado y brand-clean para el RAG de Shifty.
# Fuentes: sitio shiftlatam.agency, about-shift-pn.yaml (deprecado) y
#          validación interna del equipo. NO incluye casos detallados:
#          esos viven en Directus (news_articles) y se ingieren por separado.
# Fecha: 2026-07-08

identity:
  nombre_oficial: "Shift Latam"
  nombre_corto: "Shift Latam"
  legacy: "Antes CAC (Costa Rica, América Central y Caribe)"
  tagline: "Agencia de comunicación estratégica, reputación y creatividad cultural en Latinoamérica"
  propuesta_valor: |
    Integramos estrategia, creatividad, data e inteligencia artificial para
    construir sistemas de influencia sostenibles. No hacemos campañas aisladas:
    desarrollamos plataformas que generan conversación, confianza y resultados
    medibles.
  modelo_propietario: "Shifting Culture®"
  trayectoria: "Más de 40 años de trayectoria regional en Centroamérica. Rebranding a SHIFT en diciembre de 2022."
  headcount_aprox: "~200 colaboradores entre Centroamérica, Caribe y Ecuador"
  presencia_total: "10 hubs en Latinoamérica + oficina afiliada en Miami (Shift US)"
  presencia_regional:
    - Costa Rica
    - Guatemala
    - El Salvador
    - Honduras
    - Nicaragua
    - Panamá
    - Colombia
    - Ecuador
    - Venezuela
    - República Dominicana
  sitio_web: "https://shiftlatam.agency"

services:
  - id: crisis
    name: "Crisis y gestión de riesgo"
    description: |
      Acompañamos a organizaciones antes, durante y después de eventos sensibles
      que pueden afectar reputación: incidentes operativos, exposición regulatoria,
      controversias públicas, conflictos laborales o crisis digitales. Combinamos
      monitoreo, vocería, manejo de stakeholders y narrativa estratégica.
    cuando_aplica:
      - Riesgos regulatorios o ambientales
      - Disputas con autoridades o sindicatos
      - Crisis digitales o virales
      - Cambios de liderazgo bajo escrutinio
      - Recall de producto o fallas operativas
  - id: media-data
    name: "Media performance y data"
    description: |
      Distribución pagada, ganada y propia con medición continua. Integramos
      data de consumo digital, escucha social y performance editorial para
      decidir qué historia mover, en qué canal y a qué audiencia. Incluye
      paid media, SEO/AEO, content marketing y dashboards ejecutivos.
    capabilities:
      - Performance digital (paid + earned)
      - Escucha social y reputación en tiempo real
      - Dashboards ejecutivos de reputación e influencia
      - Mediciones de impacto en behavior y conversión
  - id: creatividad
    name: "Creatividad y campañas integradas"
    description: |
      Creatividad aplicada a problemas de negocio y cambio social. Diseñamos
      plataformas integradas que combinan PR, contenido, activación, asuntos
      públicos e influencia cultural. La creatividad no decora: traduce
      tensiones culturales en ideas que mueven mercados.
    capabilities:
      - Campañas integradas regionales y locales
      - PR creativo y storytelling de marca
      - Activaciones culturales y experiencias
      - Influencer y partnerships culturales
      - Producción audiovisual y de contenido
  - id: estrategia
    name: "Estrategia corporativa y reputación"
    description: |
      Consultoría de comunicación a nivel C-suite: arquitectura de reputación
      corporativa, asuntos públicos, comunicación interna, posicionamiento
      ejecutivo y narrativa institucional. Trabajamos con boards, CEOs y
      equipos de relaciones gubernamentales para alinear lo que la compañía
      hace con lo que el mercado escucha.
    capabilities:
      - Reputación corporativa y narrativa de marca
      - Asuntos públicos y relaciones gubernamentales
      - Comunicación interna y de cultura organizacional
      - Posicionamiento ejecutivo (CEO branding)
      - ESG, sostenibilidad y propósito
      - Comunicación financiera y de relación con inversores

shiftlab:
  name: "Shift LAB"
  description: |
    Unidad de innovación e inteligencia artificial aplicada a comunicación de
    Shift Latam. Integra tecnología, creatividad y negocio para mejorar
    análisis, acelerar decisiones y potenciar el criterio humano.
  filosofia: |
    No usamos IA como tendencia. La integramos como flujo operativo donde
    humano y máquina trabajan en el mismo proceso. La tecnología sirve a la
    estrategia, no al revés.
  capabilities:
    - Auditorías de madurez digital
    - Implementación de IA en flujos estratégicos
    - Automatización de procesos
    - Diseño de productos comunicacionales
    - Dashboards ejecutivos y data intelligence
  productos_propietarios:
    - name: "IA Shifter"
      description: |
        Agente de IA propietario que comprime data pública digital de
        consumidores en categorías como banca, vehículos, fast food, seguros,
        retail y farmacia, y la traduce en conversaciones estratégicas
        accionables en segundos.
    - name: "Brand Influence Index"
      description: |
        Índice de influencia de marca que mide señales reales de
        comportamiento (no encuestas de percepción): consumo de contenido,
        conversación pública y signos de confianza. Desarrollado con El
        Financiero para Costa Rica.

concepts:
  - id: shifting-culture
    name: "Shifting Culture®"
    description: |
      Modelo propietario de Shift Latam que conecta cultura, reputación y
      negocio en un solo sistema estratégico. Las marcas no compiten solo por
      atención sino por significado, y ese significado se construye desde la
      cultura. Detecta tensiones culturales relevantes, traduce datos en
      narrativas estratégicas y convierte conversaciones en influencia
      sostenible.
  - id: influencia
    name: "Influencia"
    description: |
      La moneda real de la comunicación estratégica. Precede a reputación,
      preferencia, confianza y crecimiento. Se construye cuando una marca
      cambia cómo se la percibe, se habla de ella, se la elige y se la vive.
  - id: tension-cultural
    name: "Tensión cultural"
    description: |
      Verdad incómoda que revela una grieta sin resolver: entre lo que la
      gente dice y siente, entre lo que la marca promete y lo que se percibe,
      entre lo que la categoría vende y lo que la gente necesita.

